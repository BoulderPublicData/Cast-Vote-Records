[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvr-pipeline"
version = "0.2.0"
description = "Boulder County Cast Vote Record retrieval, cleaning, and clustering"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Brian C. Keegan" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "requests>=2.31",
    # data-liberation extras: schema validation + audit report formatting
    "pandera[pandas]>=0.20",
    "tabulate>=0.9",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
]
publish = [
    "datasette>=1.0",
    "sqlite-utils>=3.36",
]
test = ["pytest>=7"]

[project.scripts]
cvr-pipeline = "scripts.pipeline:main"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
