[project]
name = "cvr-pipeline"
version = "0.3.0"
description = "Boulder County Cast Vote Record retrieval, cleaning, and clustering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Brian C. Keegan" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",          # the loader's xlsx reader
    "python-calamine>=0.3",   # independent second xlsx parser used by scripts.reconcile
    "requests>=2.31",
    # data-liberation extras: schema validation + audit report formatting
    "pandera[pandas]>=0.24",  # 0.24 is the first release with `pandera.pandas`
    "tabulate>=0.9",
    "ftfy>=6.2",              # repairs mojibake in contest / candidate headers
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbconvert>=7.0",
]
publish = [
    "datasette>=0.65",
    "sqlite-utils>=3.36",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cvr-pipeline = "scripts.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
