name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          # Tests use synthetic xlsx fixtures; they don't need LFS objects.
          lfs: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync deps (core + dev group; no heavy analysis extras)
        run: uv sync --frozen

      - name: Lint (ruff)
        # Rules are configured in pyproject.toml [tool.ruff].
        run: uv run --frozen ruff check --output-format=github .

      - name: Run pytest
        run: uv run --frozen pytest -v --tb=short

  reconcile:
    # Re-derives every published count from the originals. Needs the LFS
    # objects (~800 MB), so it only runs when data or pipeline code changes.
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Check out Election-Results for the SoV cross-check
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          repository: BoulderPublicData/Election-Results
          path: election-results
          sparse-checkout: data/processed/statements-of-votes

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Reconcile
        run: |
          SOV=election-results/data/processed/statements-of-votes
          if [ -d "$SOV" ]; then
            uv run --frozen python -m scripts.pipeline reconcile --sov "$SOV"
          else
            uv run --frozen python -m scripts.pipeline reconcile
          fi
