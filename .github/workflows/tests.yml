name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          # Tests use synthetic xlsx fixtures; they don't need LFS objects.
          lfs: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync deps (core + dev group; no heavy analysis extras)
        run: uv sync --frozen

      - name: Lint (ruff)
        # Rules are configured in pyproject.toml [tool.ruff].
        run: uv run --frozen ruff check --output-format=github .

      - name: Format check (ruff)
        # Run `uv run ruff format .` before pushing; the one-time reformat is in .git-blame-ignore-revs.
        run: uv run --frozen ruff format --check .

      - name: Run pytest
        run: uv run --frozen pytest -v --tb=short
